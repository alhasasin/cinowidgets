<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CINO Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: "Poppins", sans-serif;
      background: #fffaf5;
    }
    .widget-shell {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
      padding: 16px;
    }
    .widget-header {
      font-weight: 600;
      color: #5a2a0c;
      margin-bottom: 12px;
    }
    .chat-box-inline {
      border: 1px solid #f2d4c4;
      border-radius: 12px;
      height: 360px;
      overflow-y: auto;
      padding: 12px;
      background: #fffefb;
    }
    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e3c2b1;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .input-area button {
      background: #c4551e;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <div class="widget-header">CINO FAQ Bot</div>
    <div class="chat-box-inline" id="chat-box"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Ask about bread, cakes, and more..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");

      const userMessage = input.value.trim();
      if (!userMessage) return;

      chatBox.innerHTML += `<div><strong>You:</strong> ${userMessage}</div>`;
      input.value = "";

      const response = await fetch("/get", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage }),
      });

      const data = await response.json();
      chatBox.innerHTML += `<div><strong>CINO Bot:</strong> ${data.response}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
